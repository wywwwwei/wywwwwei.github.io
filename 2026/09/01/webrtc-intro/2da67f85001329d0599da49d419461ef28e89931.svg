<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <!-- Server Active Gradient -->
    <linearGradient id="serverGradActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b5fde"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowAccent" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPrimary" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSecondary" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      fill: #00d084;
      text-anchor: middle;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="380" rx="16" fill="#0a0e1a"/>

  <!-- Static Signaling Lines (Dashed) -->
  <line x1="128" y1="225" x2="400" y2="102" stroke="rgba(255,255,255,0.12)" stroke-width="1.3" stroke-dasharray="5,5"/>
  <line x1="672" y1="225" x2="400" y2="102" stroke="rgba(255,255,255,0.12)" stroke-width="1.3" stroke-dasharray="5,5"/>

  <!-- Direct Media Line (Inactive in Ph 1-3, Active in Ph 4) -->
  <g>
    <!-- Dim Line (Ph 1-3) -->
    <line x1="172" y1="251" x2="628" y2="251" stroke="rgba(255,255,255,0.10)" stroke-width="1.3">
      <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
               values="1;1;0;0;1"
               keyTimes="0;0.655;0.665;0.995;1" calcMode="linear"/>
    </line>

    <!-- Glowing Active Line (Ph 4: 7.0s - 10.6s) -->
    <line x1="172" y1="251" x2="628" y2="251" stroke="#00d084" stroke-width="3" filter="url(#glowAccent)" opacity="0">
      <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
               values="0;0;1;1;0"
               keyTimes="0;0.655;0.665;0.995;1" calcMode="linear"/>
    </line>

    <!-- Encrypted Media Label -->
    <text x="400" y="239" text-anchor="middle" font-size="11" font-weight="600" fill="#00d084" opacity="0">
      <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
               values="0;0;1;1;0"
               keyTimes="0;0.655;0.665;0.995;1" calcMode="linear"/>
      encrypted media (DTLS/SRTP)
    </text>
  </g>

  <!-- Signaling Server Node -->
  <!-- Active state (Ph 1-3) -->
  <g>
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="1;1;0;0;1"
             keyTimes="0;0.655;0.665;0.995;1" calcMode="linear"/>
    <rect x="325" y="53" width="150" height="46" rx="10" fill="url(#serverGradActive)" stroke="#7c4dff" stroke-width="1.5"/>
    <text x="400" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Signaling Server</text>
    <text x="400" y="89" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)">WebSocket / HTTP</text>
  </g>

  <!-- Idle state (Ph 4: 7.0s - 10.6s) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0"
             keyTimes="0;0.655;0.665;0.995;1" calcMode="linear"/>
    <rect x="325" y="53" width="150" height="46" rx="10" fill="rgba(124,77,255,0.25)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="400" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Signaling Server</text>
    <text x="400" y="89" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">idle — not in media path</text>
  </g>

  <!-- Peer A (Caller) -->
  <g>
    <rect x="83" y="225" width="90" height="52" rx="10" fill="rgba(255,255,255,0.06)" stroke="#5b5fde" stroke-width="1.5"/>
    <text x="128" y="249" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Peer A</text>
    <text x="128" y="263" text-anchor="middle" font-size="10" fill="#9ca3af">caller</text>
  </g>

  <!-- Peer B (Callee) -->
  <g>
    <rect x="627" y="225" width="90" height="52" rx="10" fill="rgba(255,255,255,0.06)" stroke="#5b5fde" stroke-width="1.5"/>
    <text x="672" y="249" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Peer B</text>
    <text x="672" y="263" text-anchor="middle" font-size="10" fill="#9ca3af">callee</text>
  </g>

  <!-- Phase 1: OFFER Packet (A -> S -> B) (0s - 2.4s) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;1;1;0;0"
             keyTimes="0;0.015;0.215;0.226;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 128 225 L 400 102 L 672 225"
                   keyPoints="0;0.5;1;1"
                   keyTimes="0;0.1132;0.2264;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="6" fill="#5b5fde" filter="url(#glowPrimary)"/>
    <text x="0" y="-12" text-anchor="middle" font-size="10" font-weight="600" fill="#e5e7eb">OFFER</text>
  </g>

  <!-- Phase 2: ANSWER Packet (B -> S -> A) (2.4s - 4.8s) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.226;0.24;0.44;0.452;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 672 225 L 400 102 L 128 225"
                   keyPoints="0;0;0.5;1;1"
                   keyTimes="0;0.2264;0.3396;0.4528;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="6" fill="#7c4dff" filter="url(#glowSecondary)"/>
    <text x="0" y="-12" text-anchor="middle" font-size="10" font-weight="600" fill="#e5e7eb">ANSWER</text>
  </g>

  <!-- Phase 3: ICE Candidate 1 (A -> S -> B) (4.8s - 7.0s) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;1;1;0;0"
             keyTimes="0;0.452;0.46;0.57;0.58;0.59;0.65;0.66;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 128 225 L 400 102 L 672 225"
                   keyPoints="0;0;1;0;1;1"
                   keyTimes="0;0.4528;0.5566;0.5567;0.6604;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="6" fill="#00d084" filter="url(#glowAccent)"/>
    <text x="0" y="-12" text-anchor="middle" font-size="10" font-weight="600" fill="#e5e7eb">ICE</text>
  </g>

  <!-- Phase 3: ICE Candidate 2 (B -> S -> A) (4.8s - 7.0s) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;1;1;0;0"
             keyTimes="0;0.452;0.46;0.57;0.58;0.59;0.65;0.66;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 672 225 L 400 102 L 128 225"
                   keyPoints="0;0;1;0;1;1"
                   keyTimes="0;0.4528;0.5566;0.5567;0.6604;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="6" fill="#00d084" filter="url(#glowAccent)"/>
    <text x="0" y="-12" text-anchor="middle" font-size="10" font-weight="600" fill="#e5e7eb">ICE</text>
  </g>

  <!-- Phase 4: Direct Media Stream Packets (7.0s - 10.6s) -->
  <!-- Media Packet 1: A -> B -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.66;0.67;0.99;0.999;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 172 251 L 628 251"
                   keyPoints="0;0;1;0;1;0;1;1"
                   keyTimes="0;0.6604;0.77;0.7701;0.88;0.8801;0.995;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="4.5" fill="#00d084" filter="url(#glowAccent)"/>
  </g>

  <!-- Media Packet 2: B -> A -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.68;0.69;0.99;0.999;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 628 251 L 172 251"
                   keyPoints="0;0;1;0;1;0;1;1"
                   keyTimes="0;0.68;0.79;0.7901;0.90;0.9001;0.995;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="4.5" fill="#00d084" filter="url(#glowAccent)"/>
  </g>

  <!-- Media Packet 3: A -> B (interleaved) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.72;0.73;0.99;0.999;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 172 251 L 628 251"
                   keyPoints="0;0;1;0;1;0;1;1"
                   keyTimes="0;0.72;0.82;0.8201;0.93;0.9301;0.995;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="4" fill="#6ee7b7"/>
  </g>

  <!-- Media Packet 4: B -> A (interleaved) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.74;0.75;0.99;0.999;1" calcMode="linear"/>
    <animateMotion dur="10.6s" repeatCount="indefinite"
                   path="M 628 251 L 172 251"
                   keyPoints="0;0;1;0;1;0;1;1"
                   keyTimes="0;0.74;0.85;0.8501;0.95;0.9501;0.995;1"
                   calcMode="linear"/>
    <circle cx="0" cy="0" r="4" fill="#6ee7b7"/>
  </g>

  <!-- Bottom Phase Captions -->
  <!-- Phase 1 Caption -->
  <text class="status-text" x="400" y="364" opacity="1">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="1;1;0;0;0;1"
             keyTimes="0;0.226;0.227;0.998;0.999;1" calcMode="discrete"/>
    1. Caller sends SDP offer via signaling server
  </text>

  <!-- Phase 2 Caption -->
  <text class="status-text" x="400" y="364" opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;1;1;0;0"
             keyTimes="0;0.2264;0.4528;0.4529;1" calcMode="discrete"/>
    2. Callee replies with SDP answer
  </text>

  <!-- Phase 3 Caption -->
  <text class="status-text" x="400" y="364" opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;1;1;0;0"
             keyTimes="0;0.4528;0.6604;0.6605;1" calcMode="discrete"/>
    3. ICE candidates trickle through server
  </text>

  <!-- Phase 4 Caption -->
  <text class="status-text" x="400" y="364" opacity="0">
    <animate attributeName="opacity" dur="10.6s" repeatCount="indefinite"
             values="0;1;1;0"
             keyTimes="0;0.6604;0.999;1" calcMode="discrete"/>
    4. Direct P2P media path established
  </text>
</svg>